// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.3'
        classpath 'com.google.gms:google-services:4.4.4'
        // Kotlin 2.2.20: mesmo padrão usado pelos plugins oficiais @capacitor/camera e
        // @capacitor/filesystem 8.x com AGP 8.13.0. Definido inline (não via variables.gradle)
        // porque o bloco buildscript é avaliado ANTES do `apply from: "variables.gradle"`,
        // então variáveis ext do projeto não existem neste ponto.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
