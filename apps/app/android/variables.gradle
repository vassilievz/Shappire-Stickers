ext {
    // Nota: a versão do Kotlin Gradle Plugin fica fixada em android/build.gradle
    // (bloco buildscript), pois variáveis ext daqui não estão disponíveis durante
    // a avaliação do buildscript. Os plugins oficiais que precisam de Kotlin
    // (@capacitor/camera, @capacitor/filesystem) usam o mesmo padrão.
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}