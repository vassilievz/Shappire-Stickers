name: OTA Release (OtaKit)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/app/android/**'
      - 'apps/api/**'
      - 'docs/**'
      - 'README.md'
      - '.gitignore'

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ota:
    name: Build & Publish OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck validation
        run: npm run typecheck

      - name: Run automated test suite
        run: npm run test

      - name: Validate required build configuration
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::GitHub Actions Variable VITE_API_URL is missing or empty! Configure it in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Build web application bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Verify build artifacts exist
        run: |
          if [ ! -f "apps/app/dist/index.html" ]; then
            echo "::error::Build output apps/app/dist/index.html not found!"
            exit 1
          fi

      - name: Upload and publish OTA release to OtaKit
        working-directory: apps/app
        env:
          OTAKIT_TOKEN: ${{ secrets.OTAKIT_TOKEN }}
          OTAKIT_APP_ID: ${{ vars.OTAKIT_APP_ID || secrets.OTAKIT_APP_ID }}
        run: |
          npx -y @otakit/cli@latest upload dist --release --fail-on-incompatible
