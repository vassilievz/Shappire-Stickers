name: OTA Release (OtaKit)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - 'README.md'
      - '.gitignore'

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ota:
    name: Build & Publish OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck validation
        run: npm run typecheck

      - name: Run automated test suite
        run: npm run test

      - name: Build web application bundle
        run: npm run build

      - name: Verify build artifacts exist
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Build output dist/index.html not found!"
            exit 1
          fi

      - name: Upload and publish OTA release to OtaKit
        env:
          OTAKIT_TOKEN: ${{ secrets.OTAKIT_TOKEN }}
        run: |
          npx -y @otakit/cli@latest upload dist --release --fail-on-incompatible
